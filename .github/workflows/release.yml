# Builds the downloadable artefacts and publishes them against a tag.
#
# Triggered by pushing a tag like `v0.1.0`. The tag is the decision; this
# workflow only carries it out, which is why nothing here has to be edited to
# cut a release.
#
# `workflow_dispatch` builds the same artefacts without publishing, so the
# pipeline can be tried on a branch before a tag exists to spend.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # macOS runners are Apple silicon now, so the Intel build is a
          # cross-compile. Both are shipped: an Intel Mac cannot run the
          # arm64 binary, and Rosetta is not something to make a user find
          # out about from a crash.
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Install the libraries eframe builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxext-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} --bin simlogix-gui

      # The licence and the third-party notices go in the archive, not just
      # in the repository: attribution has to reach whoever ends up with a
      # copy, and a download is exactly that.
      - name: Stage the archive
        shell: bash
        run: |
          name="simlogix-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/simlogix-gui.exe" "staging/$name/SimLogix.exe"
          else
            cp "target/${{ matrix.target }}/release/simlogix-gui" "staging/$name/simlogix"
          fi
          cp LICENSE THIRD-PARTY.md README.md "staging/$name/"
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name"
          else
            tar -czf "../$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: simlogix-*.*
          if-no-files-found: error

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `desktop-file-utils` is here for the check further down, not for the
      # build. It isn't on the runner by default -- which is how this job
      # failed the first time it ran.
      - name: Install the libraries eframe builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxext-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            desktop-file-utils

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - run: cargo install cargo-deb --locked

      # Run from the GUI crate: the package is the application, and the
      # engine crate is a library with nothing to install.
      - run: cargo deb -p simlogix-gui --output simlogix.deb

      # A package that installs is the only evidence that matters, and it is
      # cheap to get here rather than from the first person to try it.
      - name: Check that it installs and lists what it claims
        run: |
          sudo apt-get install -y ./simlogix.deb
          dpkg -L simlogix
          test -x /usr/bin/simlogix
          test -f /usr/share/applications/simlogix.desktop
          desktop-file-validate /usr/share/applications/simlogix.desktop

      - uses: actions/upload-artifact@v7
        with:
          name: archive-debian
          path: simlogix.deb
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: wix
      - run: cargo install cargo-wix --locked

      # Both settings are needed, and they answer different complaints.
      #
      # `--package` is demanded outright: cargo-wix refuses to guess once it
      # sees a workspace. The working directory is the other half — every
      # source path inside main.wxs is resolved against the *process* cwd,
      # not against the package it was told to build. Running from the
      # workspace root with `--package` alone is what made the first attempt
      # fail to find `wix\License.rtf`, the path the generated template
      # writes for itself; that failure is also the evidence that cargo-wix
      # does not change directory on its own.
      #
      # `wix/main.wxs` is checked in, edited away from that template: one
      # binary instead of three, a Start Menu shortcut, an icon, and no PATH
      # entry. `cargo wix init` would overwrite all of it, so it is
      # deliberately not run here.
      - run: cargo wix --package simlogix-gui --nocapture --output simlogix.msi
        working-directory: simlogix-gui

      - uses: actions/upload-artifact@v7
        with:
          name: archive-windows-installer
          path: simlogix-gui/simlogix.msi
          if-no-files-found: error

  publish:
    name: Publish the release
    # Only a tag is a decision to publish; a manual run just proves the
    # pipeline works.
    if: github.ref_type == 'tag'
    needs: [build, debian, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, and the tags with it: the notes are written from
      # the commits since the previous tag, and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      # Written here rather than by `gh --generate-notes`, which lists every
      # commit verbatim -- housekeeping included -- and offers no way to
      # group them. The script produces the Full Changelog link too, so the
      # notes are one thing decided in one place instead of two halves
      # stitched together by whatever gh does when both are asked for.
      - name: Write the release notes
        run: scripts/changelog.sh "${{ github.ref_name }}" | tee notes.md

      # The GitHub CLI is on the runner already, so publishing costs no
      # third-party action and nothing to keep up to date.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SimLogix ${{ github.ref_name }}" \
            --notes-file notes.md \
            artifacts/*
