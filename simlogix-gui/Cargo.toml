[package]
name = "simlogix-gui"
version = "0.1.0"
edition = "2021"
# Two binaries now: the app, and the tool that writes its icon out as a PNG.
default-run = "simlogix-gui"

[dependencies]
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simlogix-core = { path = "../simlogix-core", features = ["serde"] }
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
ron = "0.12.2"
