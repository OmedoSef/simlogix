[package]
name = "simlogix-core"
description = "Circuit model and discrete-event simulation engine behind SimLogix."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Off by default: the on-disk format lives in the GUI, and this crate has no
# business serialising anything of its own. The GUI turns it on because one
# engine type — `PortLevel` — is a *setting* a project has to remember, and
# mirroring it GUI-side would be a copy free to drift from the original.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
